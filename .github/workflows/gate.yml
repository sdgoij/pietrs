name: gate

# Branches and pull requests. A tag push is a release and is handled by
# release.yml, which runs this same gate before it publishes anything.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Run the gate
        shell: bash
        run: sh tools/gates.sh
