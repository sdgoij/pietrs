name: pietrs

# Everything, in one place.
#
# Branches and pull requests run the gate on Linux and Windows. A `v<version>`
# tag additionally checks the tag against the workspace version, then builds one
# archive per platform and publishes the release. The build jobs depend on the
# gate, so a tag cannot publish a commit that does not pass.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Superseded pull-request runs are pointless; a branch or tag run is not, so it
# queues instead of being cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Run the gate
        shell: bash
        run: sh tools/gates.sh

  # Runs beside the gate so a mistyped tag fails in seconds rather than after
  # forty-five minutes. Skipped on branches; a skipped job skips everything that
  # needs it, which is what keeps `linux`, `windows`, and `publish` off branches.
  tag:
    name: tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the workspace version
        run: |
          set -eu
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match the workspace version v${version}" >&2
            exit 1
          fi

  linux:
    name: linux (${{ matrix.target }})
    needs: [gate, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Static binaries: no C library to match, and `.cargo/config.toml` links
        # them with the toolchain's own linker, so no cross C toolchain is needed.
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -eu
          name="pietrs-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/pietrs" "dist/${name}/"
          chmod 755 "dist/${name}/pietrs"
          cp README.md LICENSE.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: windows (x86_64-pc-windows-msvc)
    needs: [gate, tag]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --locked -p cli
      - name: Package
        shell: pwsh
        run: |
          $name = "pietrs-$env:GITHUB_REF_NAME-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item "target/release/pietrs.exe" "dist/$name/"
          Copy-Item README.md, LICENSE.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: publish
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # A re-run of the workflow for the same tag updates the assets
            # instead of failing on the existing release.
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
