name: release

# A tag `v<version>` publishes one archive per platform. The gate runs first, on
# the tagged commit, so a tag cannot produce a release that does not pass.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The archive name carries the tag and the target, and each archive holds the
# binary, README.md, and LICENSE.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against the workspace version
        run: |
          set -eu
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match the workspace version v${version}" >&2
            exit 1
          fi
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Run the gate
        shell: bash
        run: sh tools/gates.sh

  linux:
    name: linux (${{ matrix.target }})
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Static binaries: no C library to match, and `.cargo/config.toml` links
        # them with the toolchain's own linker, so no cross C toolchain is needed.
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -eu
          name="pietrs-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/pietrs" "dist/${name}/"
          chmod 755 "dist/${name}/pietrs"
          cp README.md LICENSE.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: windows (x86_64-pc-windows-msvc)
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --locked -p cli
      - name: Package
        shell: pwsh
        run: |
          $name = "pietrs-$env:GITHUB_REF_NAME-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item "target/release/pietrs.exe" "dist/$name/"
          Copy-Item README.md, LICENSE.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: publish
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # A re-run of the workflow for the same tag updates the assets
            # instead of failing on the existing release.
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
