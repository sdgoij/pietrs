# The licence gate. pietrs is GPL-2.0-only; every dependency is used under a
# licence the GPL accepts. Permissive licences are listed explicitly because a
# dual-licensed crate is taken under the GPL-compatible arm, not the
# Apache-2.0 arm, which is not compatible with GPL-2.0-only. The LLVM exception
# on the cranelift crates is the one that permits combining them with GPL code.
#
# The GUI adds BSL-1.0 (clipboard-win, error-code), ISC (libloading), and the
# default-font licences: OFL-1.1 and Ubuntu-font-1.0. All are permissive and
# GPL-compatible; the fonts are data, not linked code.

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"
# accesskit_unix -> atspi -> zbus_names / zvariant / zvariant_derive are
# unmaintained (RUSTSEC-2026-0370/0371/0372): the crates were merged into
# zbus 6, which egui 0.37's accesskit does not use. These are unmaintained
# notices, not vulnerabilities, and there is no upgrade path inside the
# pinned egui version. Revisit with the next egui bump.
ignore = [
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[bans]
multiple-versions = "allow"
# The only wildcards are the unpublished crates in this workspace: their path
# dependencies carry no version, and the lockfile pins them.
wildcards = "allow"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSL-1.0",
    "GPL-2.0-only",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
