[package]
name = "cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pietrs"
path = "src/main.rs"

[[bin]]
name = "pietrs-runner"
path = "src/runner.rs"
required-features = ["codegen"]

[dependencies]
aot = { workspace = true, optional = true }
canvas.workspace = true
clap.workspace = true
codegen = { workspace = true, optional = true }
interp.workspace = true
runtime.workspace = true
runner = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tessera.workspace = true
thiserror.workspace = true

[features]
default = ["codegen"]
codegen = ["dep:codegen", "dep:aot", "dep:tempfile", "dep:runner"]

[dev-dependencies]
testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
