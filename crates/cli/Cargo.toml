[package]
name = "cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pietrs"
path = "src/main.rs"

[dependencies]
aot = { workspace = true, optional = true }
canvas.workspace = true
clap.workspace = true
codegen = { workspace = true, optional = true }
gui = { workspace = true, optional = true }
interp.workspace = true
runtime.workspace = true
tempfile = { workspace = true, optional = true }
tessera.workspace = true
thiserror.workspace = true

[features]
default = ["codegen", "editor"]
codegen = ["dep:codegen", "dep:aot", "dep:tempfile", "gui?/codegen"]
editor = ["dep:gui", "gui/native"]

[dev-dependencies]
testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
