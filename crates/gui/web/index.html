<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pietrs</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='4' height='4' fill='%23ff2b2b'/%3E%3Crect x='4' width='4' height='4' fill='%23fff36b'/%3E%3Crect y='4' width='4' height='4' fill='%232b2bff'/%3E%3Crect x='4' y='4' width='4' height='4' fill='%2333dd33'/%3E%3C/svg%3E"
    >
    <link rel="stylesheet" href="pietrs.css">
  </head>
  <body>
    <canvas id="pietrs"></canvas>
    <div id="error" hidden></div>
    <footer>
      <span class="name">pietrs</span>
      <a href="https://github.com/sdgoij/pietrs">source</a>
      <a href="https://www.dangermouse.net/esoteric/piet.html">Piet specification</a>
    </footer>
    <script type="module">
      import init, { WebHandle } from "./pietrs.js";

      const show = (message) => {
        const box = document.getElementById("error");
        box.hidden = false;
        box.textContent = message;
      };

      await init();
      const handle = new WebHandle();
      window.pietrs = handle;
      try {
        await handle.start(document.getElementById("pietrs"));
      } catch (error) {
        show(String(error));
      }
      window.addEventListener("error", (event) => show(event.message));
    </script>
  </body>
</html>
