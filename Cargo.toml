[workspace]
resolver = "3"
members = [
    "crates/canvas",
    "crates/tessera",
    "crates/runtime",
    "crates/interp",
    "crates/codegen",
    "crates/aot",
    "crates/cli",
    "crates/perf",
    "crates/runner",
    "crates/testkit",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-2.0-only"
publish = false

[workspace.dependencies]
canvas = { path = "crates/canvas" }
tessera = { path = "crates/tessera" }
runtime = { path = "crates/runtime" }
interp = { path = "crates/interp" }
codegen = { path = "crates/codegen" }
aot = { path = "crates/aot" }
runner = { path = "crates/runner" }
testkit = { path = "crates/testkit" }

cranelift-codegen = { version = "0.137", features = ["x86", "arm64"] }
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"
cranelift-object = "0.137"

clap = { version = "4", features = ["derive"] }
object = "0.40"
png = "0.18"
proptest = "1"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"
unwrap_used = "warn"
