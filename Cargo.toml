[workspace]
resolver = "3"
members = ["crates/canvas"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-2.0-only"
publish = false

[workspace.dependencies]
canvas = { path = "crates/canvas" }

png = "0.18"
proptest = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"
unwrap_used = "warn"
