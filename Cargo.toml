[workspace]
resolver = "3"
members = [
    "crates/canvas",
    "crates/tessera",
    "crates/runtime",
    "crates/interp",
    "crates/editor",
    "crates/gui",
    "crates/codegen",
    "crates/aot",
    "crates/cli",
    "crates/perf",
    "crates/runner",
    "crates/testkit",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-2.0-only"
publish = false

[workspace.dependencies]
canvas = { path = "crates/canvas" }
tessera = { path = "crates/tessera" }
runtime = { path = "crates/runtime" }
interp = { path = "crates/interp" }
editor = { path = "crates/editor" }
gui = { path = "crates/gui", default-features = false }
codegen = { path = "crates/codegen" }
aot = { path = "crates/aot" }
runner = { path = "crates/runner" }
testkit = { path = "crates/testkit" }

cranelift-codegen = { version = "0.137", features = ["x86", "arm64"] }
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"
cranelift-object = "0.137"

clap = { version = "4", features = ["derive"] }
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "persistence",
    "accesskit",
    "clipboard",
    "links",
    "x11",
    "wayland",
] }
rfd = "0.17"
# The browser build. `wasm-bindgen` must match the CLI exactly, and `web-sys`
# moves with it; one deliberate bump updates both.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "=0.3.107"
web-sys = { version = "=0.3.107", features = [
    "Blob",
    "BlobPropertyBag",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "Url",
] }
object = "0.40"
gif = "0.14"
png = "0.18"
proptest = "1"
tempfile = "3"
thiserror = "2"
# `std::time::Instant::now()` panics on `wasm32-unknown-unknown`; `web-time` is
# a drop-in replacement that re-exports `std::time` everywhere else.
web-time = "1.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"
unwrap_used = "warn"
