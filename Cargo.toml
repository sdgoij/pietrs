[workspace]
resolver = "3"
members = [
    "crates/canvas",
    "crates/tessera",
    "crates/runtime",
    "crates/interp",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-2.0-only"
publish = false

[workspace.dependencies]
canvas = { path = "crates/canvas" }
tessera = { path = "crates/tessera" }
runtime = { path = "crates/runtime" }
interp = { path = "crates/interp" }

clap = { version = "4", features = ["derive"] }
png = "0.18"
proptest = "1"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"
unwrap_used = "warn"
